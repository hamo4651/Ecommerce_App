<div class="container border rounded-4 p-5 shadow-lg " style="margin-top: 170px; background-color: #f8f9fa;width: 35%;">
  <h1 class="text-center my-4 text-primary">Log in</h1>

  <form #loginForm="ngForm" (ngSubmit)="handleSubmit(loginForm)">
    <!-- Email Field -->
    <div class="mb-4">
      <label for="email" class="form-label">Email address</label>
      <input
        type="email"
        name="email"
        class="form-control border-primary shadow-sm p-2"
        ngModel
        #email="ngModel"
        required
        pattern="^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
        id="email"
        aria-describedby="emailHelp"
      />
      <div *ngIf="email.invalid && (email.touched || submitted)" class="form-text text-danger mt-1">
        <span *ngIf="email.hasError('required')">Email is required</span>
        <span *ngIf="email.hasError('pattern')">Email is not valid</span>
      </div>
    </div>

    <!-- Password Field -->
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        name="password"
        class="form-control border-primary shadow-sm p-2"
        ngModel
        #password="ngModel"
        required
        id="password"
      />
      <div *ngIf="password.invalid && (password.touched || submitted)" class="form-text text-danger mt-1">
        Password is required
      </div>
    </div>

    <!-- Submit Button -->
    <div class="d-flex justify-content-center">
      <button type="submit" class="btn btn-primary w-75 py-2">Log in</button>
    </div>

    <!-- Google Sign-In -->
    <div id="googleSignInButton" class="mt-4 d-flex justify-content-center"></div>
    <!-- Uncomment this if you want a button -->
    <!-- 
    <button
      class="btn btn-google mt-3 w-100"

      <img

        alt="Google Icon"
        style="width: 20px; margin-right: 8px;"
      />
      Sign in with Google
    </button>
    -->
  </form>
</div>
