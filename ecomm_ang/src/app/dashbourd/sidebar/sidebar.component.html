<div class="sidebar" data-background-color="dark">
    <div class="sidebar-logo">
      <div class="logo-header" data-background-color="dark">
        <a href="index.html" class="logo">
          <img src="assets/img/kaiadmin/logo_light.svg" alt="navbar brand" class="navbar-brand" height="20" />
        </a>
        <div class="nav-toggle">
          <button class="btn btn-toggle toggle-sidebar">
            <i class="fa fa-bars"></i> <!-- Changed icon -->
          </button>
          <button class="btn btn-toggle sidenav-toggler">
            <i class="fa fa-angle-left"></i> <!-- Changed icon -->
          </button>
        </div>
        <button class="topbar-toggler more">
          <i class="fa fa-ellipsis-v"></i> <!-- Changed icon -->
        </button>
      </div>
    </div>
    
    <div class="sidebar-wrapper scrollbar scrollbar-inner" style="padding-top: 20px; width: 100%; height: 100vh;">
      <div class="sidebar-content">
        <ul class="nav nav-secondary">
          <li class="nav-item active"> <!-- Active li -->
            <a class="nav-link d-flex align-items-center" routerLink="/dashboard" routerLinkActive="text-light poppins-bold" [routerLinkActiveOptions]="{ exact: true }">
                <i class="fa fa-home  me-2"></i>                 
                <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-section">
            <span class="sidebar-mini-icon">
              <i class="fa fa-ellipsis-h"></i>
            </span>
            <h4 class="text-section">Components</h4>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" routerLink="/product" routerLinkActive="text-light poppins-bold" [routerLinkActiveOptions]="{ exact: true }">
                <i class="fa fa-tags me-2"></i> <!-- Updated icon for Products -->
                  <span>Products</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" routerLink="/category" routerLinkActive="text-light poppins-bold" [routerLinkActiveOptions]="{ exact: true }">
              <i class="fa fa-th-list me-2"></i> <!-- Changed icon -->
              <span>Categories</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" routerLink="/orders" routerLinkActive="text-light poppins-bold" [routerLinkActiveOptions]="{ exact: true }">
              <i class="fa fa-shopping-cart me-2"></i> <!-- Changed icon -->
              <span>Orders</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link d-flex align-items-center" routerLink="/users" routerLinkActive="text-light poppins-bold" [routerLinkActiveOptions]="{ exact: true }">
              <i class="fa fa-users me-2"></i> <!-- Changed icon -->
              <span>Users</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
