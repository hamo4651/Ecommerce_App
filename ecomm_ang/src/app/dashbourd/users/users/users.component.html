<div class="container " style="margin-top: 175px;">
  <div class="row">
    <div class="col-3">
      <app-sidebar></app-sidebar>
    </div>
    <div class="col-9">
      <h2 class="text-dark roboto-bold mb-4">Users</h2>
      <div class="row gy-4">
        <div
          class="col-sm-6 col-md-4"
          *ngFor="let user of users"
        >
          <div class="card shadow border-0 rounded">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="card-title text-dark m-0">{{ user.name }}</h5>
                <a
                  class="btn btn-outline-primary btn-sm rounded-pill"
                  [routerLink]="['/user', user.id]"
                >
                  View Details
                </a>
              </div>
              <p class="card-subtitle text-muted mb-1">
                {{ user.email }}
              </p>
              <p *ngIf="user.phone" class="text-muted mb-1" style="font-size: 0.9rem">
                <i class="fa-solid fa-phone me-1 text-primary"></i>{{ user.phone }}
              </p>
            </div>

            <div class="card-footer bg-light d-flex justify-content-between align-items-center">
              <span *ngIf="user.address" class="text-muted">
                <i class="fa-solid fa-location-dot me-1"></i>{{ user.address }}
              </span>
              <span class="text-muted">
                <b>{{ user.role }}</b>
              </span>
              <button
                class="btn btn-danger btn-sm rounded-pill"
                data-bs-toggle="modal"
                [attr.data-bs-target]="'#exampleModal' + user.id"
              >
                Delete
              </button>
            </div>
          </div>

          <!-- Modal -->
          <div
            class="modal fade"
            [id]="'exampleModal' + user.id"
            tabindex="-1"
            aria-labelledby="exampleModalLabel"
            aria-hidden="true"
          >
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="exampleModalLabel">
                    Delete Confirmation
                  </h5>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body">
                  Are you sure you want to delete <b>{{ user.name }}</b>?
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary btn-sm rounded-pill"
                    data-bs-dismiss="modal"
                  >
                    Close
                  </button>
                  <button
                    type="button"
                    class="btn btn-danger btn-sm rounded-pill"
                    data-bs-dismiss="modal"
                    (click)="deleteUser(user.id)"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
